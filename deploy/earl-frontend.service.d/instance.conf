# Earl-frontend GREEN instance drop-in.
# Installed at /etc/systemd/system/earl-frontend.service.d/instance.conf on the
# frontend host so the running GREEN instance identifies itself in /healthz.
# Kept separate from the unit file (not in earl-frontend.service) so both
# instances share identical `next start` definitions and differ only by env.
[Service]
Environment=EARL_INSTANCE=green
